# =============================================================================
# NYC Taxi Dev Stack — chạy local không cần K8s
# Bao gồm: MinIO, MLflow, Trino, Superset
#
# Khởi động:  docker compose -f docker-compose.dev.yml up -d
# Dừng:       docker compose -f docker-compose.dev.yml down
# Xóa data:   docker compose -f docker-compose.dev.yml down -v
# =============================================================================

networks:
  nyc-taxi-net:
    driver: bridge

volumes:
  minio-data:
  mlflow-data:
  superset-db-data:
  trino-data:

services:

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (Bronze / Silver / Gold buckets)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: nyc-minio
    networks: [nyc-taxi-net]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tạo buckets + upload Delta data từ local pipeline run
  minio-init:
    image: minio/mc:latest
    container_name: nyc-minio-init
    networks: [nyc-taxi-net]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - /teamspace/studios/this_studio/NYC_Taxis_BigData_Pipeline/_local_delta_store:/local_data:ro
      - /teamspace/studios/this_studio/NYC_Taxis_BigData_Pipeline/_local_bi_lakehouse:/local_bi_lakehouse:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/bronze
        mc mb --ignore-existing local/silver
        mc mb --ignore-existing local/gold
        mc mb --ignore-existing local/lakehouse
        mc mb --ignore-existing local/mlflow
        mc mb --ignore-existing local/warehouse
        echo 'Buckets created.'
        echo 'Uploading Delta Lake data from local pipeline run...'
        if [ -d /local_data/bronze ]; then
          mc cp --recursive /local_data/bronze/ local/bronze/trips/
          echo '  bronze uploaded'
        fi
        if [ -d /local_data/silver ]; then
          mc cp --recursive /local_data/silver/ local/silver/trips/
          echo '  silver uploaded'
        fi
        if [ -d /local_data/gold ]; then
          mc cp --recursive /local_data/gold/ local/gold/features/
          echo '  gold uploaded'
        fi
        if [ -d /local_bi_lakehouse ]; then
          mc cp --recursive /local_bi_lakehouse/ local/lakehouse/
          echo '  lakehouse BI preview uploaded'
        fi
        echo 'Done: bronze, silver, gold, mlflow, warehouse ready.'
    restart: "no"

  # ---------------------------------------------------------------------------
  # MLflow — Experiment tracking + Model Registry
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: nyc-mlflow
    networks: [nyc-taxi-net]
    ports:
      - "${MLFLOW_HOST_PORT:-5001}:5000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root s3://mlflow/
        --serve-artifacts
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Hive Metastore — catalog cho Trino đọc Delta Lake
  # naushadh/hive-metastore: dùng PostgreSQL backend (postgres-superset)
  # ---------------------------------------------------------------------------
  hive-metastore:
    image: naushadh/hive-metastore
    container_name: nyc-hive-metastore
    networks: [nyc-taxi-net]
    ports:
      - "9083:9083"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres-superset
      DATABASE_PORT: "5432"
      DATABASE_DB: hive_metastore
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset
      METASTORE_PORT: "9083"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_PREFIX: s3a://warehouse/
      S3_BUCKET: warehouse
      REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c '</dev/tcp/127.0.0.1/9083' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Trino — SQL query engine đọc Delta Lake qua Hive Metastore
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:480
    container_name: nyc-trino
    networks: [nyc-taxi-net]
    ports:
      - "8080:8080"
    depends_on:
      hive-metastore:
        condition: service_healthy
    volumes:
      - ./infra/docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./infra/docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./infra/docker/trino/node.properties:/etc/trino/node.properties:ro
      - ./infra/docker/trino/catalog/delta.properties:/etc/trino/catalog/delta.properties:ro
      - ./infra/docker/trino/catalog/hive.properties:/etc/trino/catalog/hive.properties:ro
      - trino-data:/data/trino
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Hive Tables Init — đăng ký Delta tables vào Hive Metastore qua Trino
  # Chạy 1 lần sau khi Trino sẵn sàng
  # ---------------------------------------------------------------------------
  hive-init:
    image: trinodb/trino:480
    container_name: nyc-hive-init
    networks: [nyc-taxi-net]
    depends_on:
      trino:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./infra/docker/scripts/hive-init.sh:/hive-init.sh:ro
    command: ["/bin/bash", "/hive-init.sh"]

  # ---------------------------------------------------------------------------
  # PostgreSQL — metadata store cho Superset
  # ---------------------------------------------------------------------------
  postgres-superset:
    image: postgres:15-alpine
    container_name: nyc-postgres-superset
    networks: [nyc-taxi-net]
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tạo database hive_metastore trong postgres
  postgres-init:
    image: postgres:15-alpine
    container_name: nyc-postgres-init
    networks: [nyc-taxi-net]
    depends_on:
      postgres-superset:
        condition: service_healthy
    restart: "no"
    environment:
      PGPASSWORD: superset
    entrypoint:
      - /bin/sh
      - -c
      - |
        psql -h postgres-superset -U superset -d superset \
          -c "CREATE DATABASE hive_metastore OWNER superset" 2>/dev/null || echo "DB already exists, continuing"

  # ---------------------------------------------------------------------------
  # Superset — BI dashboard
  # ---------------------------------------------------------------------------
  superset:
    build:
      context: ./infra/docker/superset
    image: nyc-taxi-superset-ai:local
    container_name: nyc-superset
    networks: [nyc-taxi-net]
    ports:
      - "8088:8088"
    depends_on:
      postgres-superset:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: "nyc-taxi-dev-secret-2024"
      PYTHONPATH: /app
    volumes:
      - ./infra/docker/superset/superset_config.py:/app/superset_config.py:ro
    command: >
      /bin/bash -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@local.dev --password admin 2>/dev/null || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088 --with-threads
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Superset MCP — bridge cho AI assistants (local dev only)
  # ---------------------------------------------------------------------------
  superset-mcp:
    build:
      context: ./infra/docker/superset
    image: nyc-taxi-superset-ai:local
    container_name: nyc-superset-mcp
    networks: [nyc-taxi-net]
    ports:
      - "5008:5008"
    depends_on:
      superset:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: "nyc-taxi-dev-secret-2024"
      PYTHONPATH: /app
    volumes:
      - ./infra/docker/superset/superset_config.py:/app/superset_config.py:ro
    command: ["superset", "mcp", "run", "--host", "0.0.0.0", "--port", "5008"]
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport socket\ns = socket.create_connection(('127.0.0.1', 5008), 2)\ns.close()\nPY"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Superset Init — tự động tạo Trino database connection trong Superset
  # ---------------------------------------------------------------------------
  superset-trino-init:
    image: curlimages/curl:latest
    container_name: nyc-superset-trino-init
    networks: [nyc-taxi-net]
    depends_on:
      superset:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./infra/docker/scripts/superset-trino-init.sh:/superset-trino-init.sh:ro
    entrypoint: ["/bin/sh", "/superset-trino-init.sh"]
