apiVersion: v1
kind: Namespace
metadata:
  name: lakehouse

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hive-metastore-pvc
  namespace: lakehouse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  namespace: lakehouse
data:
  SERVICE_NAME: "metastore"
  DB_DRIVER: "derby"
  SERVICE_OPTS: >-
    -Dhive.metastore.warehouse.dir=s3a://warehouse/iceberg
    -Ddatanucleus.schema.autoCreateAll=true
    -Dhive.metastore.schema.verification=false
    -Dfs.s3a.endpoint=http://minio-api.minio.svc.cluster.local:9000
    -Dfs.s3a.endpoint.region=us-east-1
    -Dfs.s3a.access.key=minioadmin
    -Dfs.s3a.secret.key=minioadmin
    -Dfs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    -Dfs.s3a.path.style.access=true
    -Dfs.s3a.connection.ssl.enabled=false
    -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
    -Dfs.s3a.change.detection.mode=none
  hive-site.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="no"?>
    <configuration>
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>s3a://warehouse/iceberg</value>
      </property>
      <property>
        <name>datanucleus.schema.autoCreateAll</name>
        <value>true</value>
      </property>
      <property>
        <name>hive.metastore.schema.verification</name>
        <value>false</value>
      </property>
      <property>
        <name>fs.s3a.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://minio-api.minio.svc.cluster.local:9000</value>
      </property>
      <property>
        <name>fs.s3a.endpoint.region</name>
        <value>us-east-1</value>
      </property>
      <property>
        <name>fs.s3a.access.key</name>
        <value>minioadmin</value>
      </property>
      <property>
        <name>fs.s3a.secret.key</name>
        <value>minioadmin</value>
      </property>
      <property>
        <name>fs.s3a.aws.credentials.provider</name>
        <value>org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.connection.ssl.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>fs.s3a.change.detection.mode</name>
        <value>none</value>
      </property>
    </configuration>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      initContainers:
        - name: wait-for-minio
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until /usr/bin/mc alias set local http://minio-api.minio.svc.cluster.local:9000 minioadmin minioadmin; do
                echo "Waiting for MinIO API..."
                sleep 3
              done
              /usr/bin/mc mb --ignore-existing local/warehouse
      containers:
        - name: hive-metastore
          image: hive-metastore-s3a:3.1.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hive-metastore-config
          ports:
            - containerPort: 9083
          volumeMounts:
            - name: hive-metastore-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
            - name: hive-data
              mountPath: /opt/hive/data/warehouse
      volumes:
        - name: hive-metastore-config
          configMap:
            name: hive-metastore-config
        - name: hive-data
          persistentVolumeClaim:
            claimName: hive-metastore-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: lakehouse
spec:
  selector:
    app: hive-metastore
  ports:
    - name: thrift
      port: 9083
      targetPort: 9083
