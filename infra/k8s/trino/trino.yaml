apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: serving
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
  jvm.config: |
    -server
    -Xmx4G
    -Xms1G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+ExitOnOutOfMemoryError
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/data/trino/heap.hprof
  node.properties: |
    node.environment=development
    node.id=trino-coordinator
    node.data-dir=/data/trino
  # -----------------------------------------------------------------------
  # Catalog: delta — đọc Delta Lake tables trực tiếp từ MinIO qua Hive Metastore.
  # Dùng cho silver_nyc_taxi, gold_ml, gold_monitoring.
  # -----------------------------------------------------------------------
  delta.properties: |
    connector.name=delta_lake
    hive.metastore=thrift
    hive.metastore.uri=thrift://hive-metastore.serving.svc.cluster.local:9083
    fs.native-s3.enabled=true
    s3.endpoint=http://minio-api.storage.svc.cluster.local:9000
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
    delta.enable-non-concurrent-writes=true
    delta.register-table-procedure.enabled=true
  # -----------------------------------------------------------------------
  # Catalog: hive — fallback cho Parquet/ORC tables
  # -----------------------------------------------------------------------
  hive.properties: |
    connector.name=hive
    hive.metastore=thrift
    hive.metastore.uri=thrift://hive-metastore.serving.svc.cluster.local:9083
    fs.native-s3.enabled=true
    s3.endpoint=http://minio-api.storage.svc.cluster.local:9000
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
    hive.non-managed-table-writes-enabled=true
  # -----------------------------------------------------------------------
  # Catalog: iceberg — cho Iceberg tables (nếu cần sau này)
  # -----------------------------------------------------------------------
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=hive_metastore
    hive.metastore.uri=thrift://hive-metastore.serving.svc.cluster.local:9083
    fs.native-s3.enabled=true
    s3.endpoint=http://minio-api.storage.svc.cluster.local:9000
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: serving
  labels:
    app: trino
    component: query-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
        component: query-engine
    spec:
      containers:
        - name: trino
          image: trinodb/trino:480
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: trino-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: trino-config
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config
            - name: trino-config
              mountPath: /etc/trino/node.properties
              subPath: node.properties
            - name: trino-config
              mountPath: /etc/trino/catalog/delta.properties
              subPath: delta.properties
            - name: trino-config
              mountPath: /etc/trino/catalog/hive.properties
              subPath: hive.properties
            - name: trino-config
              mountPath: /etc/trino/catalog/iceberg.properties
              subPath: iceberg.properties
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: trino-config
          configMap:
            name: trino-config
---
# ClusterIP — truy cập nội bộ từ Superset
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: serving
spec:
  selector:
    app: trino
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# NodePort — port-forward hoặc truy cập từ ngoài cluster
apiVersion: v1
kind: Service
metadata:
  name: trino-nodeport
  namespace: serving
spec:
  type: NodePort
  selector:
    app: trino
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30091
