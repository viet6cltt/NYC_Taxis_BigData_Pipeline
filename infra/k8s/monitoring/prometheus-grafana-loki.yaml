apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kubernetes-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: kubernetes-pods-annotated
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: false
      retention_period: 72h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.1
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            selectors:
              - role: pod
                field: spec.nodeName=${NODE_NAME}
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.2.1
          args:
            - -config.file=/etc/promtail/promtail.yml
            - -config.expand-env=true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/log/containers
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/log/containers
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: nyc-taxi
        orgId: 1
        folder: NYC Taxi
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-nyc-taxi-dashboard
  namespace: monitoring
data:
  nyc-taxi-streaming.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"lakehouse|ingestion\", container!=\"POD\", image!=\"\"}[1m]) and on(namespace,pod,container) (time() - container_last_seen{namespace=~\"lakehouse|ingestion\", container!=\"POD\", image!=\"\"} < 30)) by (namespace, pod)",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "title": "Pod CPU",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"lakehouse|ingestion\", container!=\"POD\", image!=\"\"} and on(namespace,pod,container) (time() - container_last_seen{namespace=~\"lakehouse|ingestion\", container!=\"POD\", image!=\"\"} < 30)) by (namespace, pod)",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "title": "Pod Memory",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 4,
          "targets": [
            {
              "expr": "count(count by (pod) (container_memory_working_set_bytes{namespace=\"lakehouse\", pod=~\".*-exec-[0-9]+.*\", container!=\"POD\", image!=\"\"} and on(namespace,pod,container) (time() - container_last_seen{namespace=\"lakehouse\", pod=~\".*-exec-[0-9]+.*\", container!=\"POD\", image!=\"\"} < 30))) or vector(0)",
              "legendFormat": "executors"
            }
          ],
          "title": "Spark Executor Autoscaling",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 11,
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"POD\", image!=\"\"}[1m]))",
              "legendFormat": "used cores"
            },
            {
              "expr": "sum(machine_cpu_cores)",
              "legendFormat": "total cores"
            }
          ],
          "title": "Cluster CPU Used / Total",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 12,
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{container!=\"POD\", image!=\"\"} and on(namespace,pod,container) (time() - container_last_seen{container!=\"POD\", image!=\"\"} < 30))",
              "legendFormat": "used memory"
            },
            {
              "expr": "sum(machine_memory_bytes)",
              "legendFormat": "total memory"
            }
          ],
          "title": "Cluster Memory Used / Total",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 5,
          "targets": [
            {
              "expr": "avg_over_time({namespace=\"lakehouse\"} |= \"[benchmark][spark_progress]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_progress\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | unwrap trigger_execution_ms [$__interval])",
              "legendFormat": "triggerExecution"
            },
            {
              "expr": "avg_over_time({namespace=\"lakehouse\"} |= \"[benchmark][spark_progress]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_progress\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | unwrap add_batch_ms [$__interval])",
              "legendFormat": "addBatch"
            }
          ],
          "title": "Spark Microbatch Duration",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "unit": "rows"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "id": 6,
          "targets": [
            {
              "expr": "avg_over_time({namespace=\"lakehouse\"} |= \"[benchmark][spark_progress]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_progress\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | unwrap num_input_rows [$__interval])",
              "legendFormat": "input rows"
            }
          ],
          "title": "Spark Streaming Input Rows",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "unit": "rps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "id": 7,
          "targets": [
            {
              "expr": "avg_over_time({namespace=\"lakehouse\"} |= \"[benchmark][spark_progress]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_progress\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | unwrap input_rows_per_second [$__interval])",
              "legendFormat": "input"
            },
            {
              "expr": "avg_over_time({namespace=\"lakehouse\"} |= \"[benchmark][spark_progress]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_progress\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | unwrap processed_rows_per_second [$__interval])",
              "legendFormat": "processed"
            }
          ],
          "title": "Spark Streaming Rows Per Second",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "id": 8,
          "targets": [
            {
              "expr": "max_over_time({namespace=\"lakehouse\"} |= \"[benchmark][spark_batch_job]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_batch_job\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | status=\"success\" | unwrap duration_ms [$__interval])",
              "legendFormat": "batch {{job_name}}"
            },
            {
              "expr": "max_over_time({namespace=\"lakehouse\"} |= \"[benchmark][spark_training_job]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_training_job\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | status=\"success\" | unwrap duration_ms [$__interval])",
              "legendFormat": "training {{job_name}}"
            }
          ],
          "title": "Spark Batch/Training Job Duration",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "id": 9,
          "targets": [
            {
              "expr": "max_over_time({namespace=\"lakehouse\"} |= \"[benchmark][spark_training_job]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_training_job\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | status=\"success\" | unwrap test_r2 [$__interval])",
              "legendFormat": "test r2"
            },
            {
              "expr": "max_over_time({namespace=\"lakehouse\"} |= \"[benchmark][spark_training_job]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_training_job\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | status=\"success\" | unwrap test_rmse [$__interval])",
              "legendFormat": "test rmse"
            }
          ],
          "title": "Training Quality",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 40},
          "id": 3,
          "targets": [
            {
              "expr": "{namespace=\"lakehouse\"} |= \"[benchmark][spark_progress]\""
            }
          ],
          "title": "Spark Microbatch Progress Logs",
          "type": "logs"
        },
        {
          "datasource": "Loki",
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 40},
          "id": 10,
          "targets": [
            {
              "expr": "{namespace=\"lakehouse\"} |~ \"\\\\[benchmark\\\\]\\\\[spark_(batch|training)_job\\\\]\" | regexp \"\\\\[benchmark\\\\]\\\\[spark_(batch|training)_job\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | line_format \"job={{.job_name}} status={{.status}} duration={{.duration_ms}}ms output={{.output_path}} run={{.run_id}}\""
            }
          ],
          "title": "Spark Batch/Training Benchmark Logs",
          "type": "logs"
        },
        {
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 50},
          "id": 13,
          "targets": [
            {
              "expr": "avg_over_time({namespace=\"lakehouse\"} |= \"[stream_predict][prediction_batch]\" | regexp \"\\\\[stream_predict\\\\]\\\\[prediction_batch\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | unwrap avg_predicted_fare_amount [$__interval])",
              "legendFormat": "batch avg"
            },
            {
              "expr": "min_over_time({namespace=\"lakehouse\"} |= \"[stream_predict][prediction_batch]\" | regexp \"\\\\[stream_predict\\\\]\\\\[prediction_batch\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | unwrap min_predicted_fare_amount [$__interval])",
              "legendFormat": "batch min"
            },
            {
              "expr": "max_over_time({namespace=\"lakehouse\"} |= \"[stream_predict][prediction_batch]\" | regexp \"\\\\[stream_predict\\\\]\\\\[prediction_batch\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | unwrap max_predicted_fare_amount [$__interval])",
              "legendFormat": "batch max"
            }
          ],
          "title": "Streaming Predicted Fare By Batch",
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 50},
          "id": 14,
          "targets": [
            {
              "expr": "{namespace=\"lakehouse\"} |= \"[stream_predict][prediction]\" | regexp \"\\\\[stream_predict\\\\]\\\\[prediction\\\\] (?P<json>.*)\" | line_format \"{{.json}}\" | json | line_format \"batch={{.batch_id}} trip={{.trip_id}} fare={{.predicted_fare_amount}} month={{.year_month}} pickup={{.pickup_datetime}} route={{.pulocation_id}}->{{.dolocation_id}} model={{.model_version}}\""
            }
          ],
          "title": "Streaming Prediction Logs",
          "type": "logs"
        }
      ],
      "schemaVersion": 39,
      "tags": ["nyc-taxi", "streaming", "benchmark"],
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "refresh": "5s",
      "title": "NYC Taxi Streaming Benchmark",
      "uid": "nyc-taxi-streaming-benchmark",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-nyc-taxi-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30030
