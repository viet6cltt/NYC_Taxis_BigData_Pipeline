---
# Spark Streaming Inference — submitted via spark-submit, not a plain Deployment.
# This manifest is used for reference / manual restart only.
# Normally launched via scripts/serving/run_stream_predict.sh
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyc-taxi-stream-predict
  namespace: lakehouse
  labels:
    app: nyc-taxi-stream-predict
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nyc-taxi-stream-predict
  template:
    metadata:
      labels:
        app: nyc-taxi-stream-predict
    spec:
      serviceAccountName: spark-user
      containers:
        - name: stream-predict
          image: nyc-taxi-stream-predict:v1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.mlops.svc.cluster.local:5000"
            - name: MINIO_ENDPOINT
              value: "http://minio-api.storage.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: SILVER_STARTED_PATH
              value: "s3a://lakehouse/silver/nyc-taxi/trip_started"
            - name: GOLD_ROUTE_ESTIMATES_PATH
              value: "s3a://lakehouse/gold/ml/route_estimates"
            - name: GOLD_PREDICTIONS_PATH
              value: "s3a://lakehouse/gold/ml/predictions"
            - name: CHECKPOINT_LOCATION
              value: "s3a://lakehouse/_checkpoints/gold/ml/stream_predict"
            - name: N_LOCATION_CLUSTERS
              value: "5"
            - name: N_TEMPORAL_CLUSTERS
              value: "4"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
